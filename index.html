<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>네온 아케이드 유튜브 리듬 게임</title>
    <style>
        :root {
            --neon-cyan: #00f0ff;
            --neon-magenta: #ff007f;
            --neon-purple: #9d4edd;
            --bg-dark: #0a0a12;
        }

        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }

        /* 메인 설정 UI */
        #setup-ui {
            background: linear-gradient(145deg, #141423, #1a1a3a);
            border: 2px solid var(--neon-purple);
            box-shadow: 0 0 20px rgba(157, 78, 221, 0.4);
            padding: 30px;
            border-radius: 16px;
            margin-bottom: 20px;
            text-align: center;
            z-index: 100;
            width: 380px;
        }
        #setup-ui h2 {
            margin-top: 0;
            color: var(--neon-cyan);
            text-shadow: 0 0 8px var(--neon-cyan);
            font-size: 26px;
            letter-spacing: 2px;
        }
        #setup-ui input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #444;
            background-color: #0d0d1a;
            color: white;
            border-radius: 8px;
            font-size: 14px;
            transition: 0.3s;
        }
        #setup-ui input:focus {
            border-color: var(--neon-cyan);
            outline: none;
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.5);
        }
        .difficulty-container {
            margin-bottom: 25px;
        }
        .difficulty-container p {
            margin-bottom: 10px;
            font-size: 14px;
            color: #aaa;
        }
        .diff-btn {
            padding: 10px 20px;
            margin: 0 5px;
            background-color: #222;
            color: #888;
            border: 1px solid #444;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .diff-btn.active {
            border-color: var(--neon-magenta);
            background-color: rgba(255, 0, 127, 0.1);
            color: var(--neon-magenta);
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.3);
        }
        #start-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, var(--neon-magenta), var(--neon-purple));
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 0, 127, 0.4);
            transition: 0.2s;
        }
        #start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 0, 127, 0.6);
        }

        /* 게임 헤더 */
        #game-header {
            width: 420px;
            display: none;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        #score-display {
            font-size: 26px;
            font-weight: 800;
            color: var(--neon-cyan);
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }
        #exit-btn {
            padding: 8px 16px;
            background-color: rgba(255,255,255,0.05);
            color: #ccc;
            border: 1px solid #444;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }
        #exit-btn:hover {
            background-color: var(--neon-magenta);
            border-color: var(--neon-magenta);
            color: white;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
        }

        /* 게임 메인 컨테이너 */
        #game-container {
            position: relative;
            width: 420px;
            height: 650px;
            background-color: rgba(10, 10, 20, 0.88);
            border: 3px solid #2a2a4a;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            overflow: hidden;
            display: none; 
            flex-direction: row;
        }
        #youtube-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.45;
            /* pointer-events: none; 를 제거하여 필요한 경우 영상 클릭이 가능하게 변경 */
        }

        /* 트랙 스타일 */
        .track {
            flex: 1;
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
            background: linear-gradient(to bottom, transparent 70%, rgba(255,255,255,0.02));
            transition: background 0.1s;
        }
        .track:last-child {
            border-right: none;
        }

        /* 노트 */
        .note {
            position: absolute;
            width: 92%;
            left: 4%;
            height: 18px;
            background: linear-gradient(90deg, #2bf0ff, #00a2ff);
            border-radius: 3px;
            box-shadow: 0 0 12px #00f0ff, inset 0 2px 2px rgba(255,255,255,0.7);
        }

        /* 판정선 및 텍스트 */
        #hit-line {
            position: absolute;
            bottom: 70px;
            width: 100%;
            height: 6px;
            background-color: var(--neon-magenta);
            box-shadow: 0 0 15px var(--neon-magenta);
            z-index: 10;
        }
        .key-label {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-weight: 900;
            font-size: 22px;
            color: #666a8a;
        }
        
        .key-active {
            background: linear-gradient(to top, rgba(0, 240, 255, 0.2) 0%, rgba(0, 240, 255, 0.05) 50%, transparent 100%);
        }
        .key-active .key-label {
            color: var(--neon-cyan);
            text-shadow: 0 0 10px var(--neon-cyan);
        }

        #judgment-display {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 32px;
            font-weight: 900;
            font-style: italic;
            pointer-events: none;
            z-index: 20;
            letter-spacing: 3px;
            opacity: 0;
        }
        .animate-judg {
            animation: popText 0.3s ease-out forwards;
        }

        @keyframes popText {
            0% { transform: translate(-50%, -30%) scale(0.6); opacity: 0; }
            30% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
            100% { transform: translate(-50%, -60%) scale(1.0); opacity: 0; }
        }

        #high-score-text {
            font-size: 13px;
            color: #666a8a;
            margin-top: 15px;
        }
        #high-score {
            color: var(--neon-cyan);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="setup-ui">
        <h2>NEON RHYTHM</h2>
        <input type="text" id="youtube-url" placeholder="유튜브 링크를 입력하세요" value="https://www.youtube.com/watch?v=dQw4w9WgXcQ">
        
        <div class="difficulty-container">
            <p>DIFFICULTY</p>
            <button class="diff-btn" onclick="selectDifficulty('easy', event)">EASY</button>
            <button class="diff-btn active" onclick="selectDifficulty('normal', event)">NORMAL</button>
            <button class="diff-btn" onclick="selectDifficulty('hard', event)">HARD</button>
        </div>

        <button id="start-btn" onclick="startGame()">GAME START</button>
        <div id="high-score-text">HIGH SCORE: <span id="high-score">0</span></div>
    </div>

    <div id="game-header">
        <div id="score-display">SCORE: <span id="score">0</span></div>
        <button id="exit-btn" onclick="endGame(false)">QUIT</button>
    </div>

    <div id="game-container">
        <div id="youtube-bg"><div id="player"></div></div>
        <div id="judgment-display">PERFECT</div>
        <div id="hit-line"></div>
        <div class="track" id="track-0"><div class="key-label">D</div></div>
        <div class="track" id="track-1"><div class="key-label">F</div></div>
        <div class="track" id="track-2"><div class="key-label">J</div></div>
        <div class="track" id="track-3"><div class="key-label">K</div></div>
    </div>

    <script>
        // 비동기로 유튜브 스크립트 강제 로드
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('high-score');
        const setupUI = document.getElementById('setup-ui');
        const gameHeader = document.getElementById('game-header');
        const gameContainer = document.getElementById('game-container');
        const startBtn = document.getElementById('start-btn');
        const judgmentDisplay = document.getElementById('judgment-display');
        
        const tracks = [
            document.getElementById('track-0'),
            document.getElementById('track-1'),
            document.getElementById('track-2'),
            document.getElementById('track-3')
        ];
        
        const keys = { 'd': 0, 'f': 1, 'j': 2, 'k': 3 };
        
        let notes = []; 
        let score = 0;
        let highScore = localStorage.getItem('rhythm_high_score') || 0;
        let gameInterval;
        let animationId;
        
        let currentDifficulty = 'normal';
        let noteSpeed = 7; 
        let spawnRate = 500; 

        const gameHeight = 650;
        const hitZone = 70;  
        const hitTolerance = 45; 
        let player;

        highScoreElement.innerText = highScore;

        // API가 준비 안 되어도 버튼은 작동하게 만듦
        function onYouTubeIframeAPIReady() {
            console.log("유튜브 API 준비 완료");
        }

        function selectDifficulty(diff, e) {
            currentDifficulty = diff;
            const buttons = document.querySelectorAll('.diff-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            e.target.classList.add('active');
            
            if (diff === 'easy') {
                noteSpeed = 5;
                spawnRate = 750;
            } else if (diff === 'normal') {
                noteSpeed = 7;
                spawnRate = 500;
            } else if (diff === 'hard') {
                noteSpeed = 10;
                spawnRate = 320;
            }
        }

        function extractVideoID(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function showJudgment(text, color) {
            judgmentDisplay.innerText = text;
            judgmentDisplay.style.color = color;
            judgmentDisplay.style.textShadow = `0 0 10px ${color}`;
            judgmentDisplay.classList.remove('animate-judg');
            void judgmentDisplay.offsetWidth; 
            judgmentDisplay.classList.add('animate-judg');
        }

        function updateScore(amount) {
            score += amount;
            scoreElement.innerText = score;
        }

        function startGame() {
            const urlInput = document.getElementById('youtube-url').value;
            const videoId = extractVideoID(urlInput);

            if (!videoId) {
                alert("올바른 유튜브 링크를 입력해주세요!");
                return;
            }

            score = 0;
            scoreElement.innerText = score;
            notes = [];

            // UI를 먼저 강제로 전환 (API 지연으로 인한 렉 방지)
            setupUI.style.display = 'none';
            gameHeader.style.display = 'flex';
            gameContainer.style.display = 'flex';

            initPlayer(videoId);
        }

        function initPlayer(videoId) {
            document.getElementById('youtube-bg').innerHTML = '<div id="player"></div>';

            // 브라우저 환경에 따라 'YT' 객체가 없을 때를 대비한 예외 처리
            if (typeof YT === 'undefined' || !YT.Player) {
                alert("웹 보안 환경으로 인해 유튜브 영상을 불러올 수 없습니다.\n파일을 더블클릭해 열지 말고 개발 서버(Live Server 등)를 이용해주세요.\n(일단 임시로 노트 떨어지기 모드를 시작합니다.)");
                startFallbackGame();
                return;
            }

            player = new YT.Player('player', {
                height: '100%',
                width: '100%',
                videoId: videoId,
                playerVars: {
                    'autoplay': 1,
                    'controls': 0,
                    'disablekb': 1,
                    'rel': 0,
                    'modestbranding': 1
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            // 강제 재생 시도
            event.target.playVideo();
        }

        // 임시 로컬 모드 (유튜브 차단 시 백업 가동용)
        function startFallbackGame() {
            if (!gameInterval) {
                gameInterval = setInterval(spawnNote, spawnRate);
            }
            if (!animationId) {
                gameLoop();
            }
        }

        function onPlayerStateChange(event) {
            // 영상 재생 중이거나 버퍼링 중일 때 게임 시작 보장
            if (event.data == YT.PlayerState.PLAYING || event.data == 3) {
                if (!gameInterval) {
                    gameInterval = setInterval(spawnNote, spawnRate);
                }
                if (!animationId) {
                    gameLoop();
                }
            }
            else if (event.data == YT.PlayerState.PAUSED) {
                pauseGameLoop();
            }
            else if (event.data == YT.PlayerState.ENDED) {
                endGame(true); 
            }
        }

        function spawnNote() {
            const trackIndex = Math.floor(Math.random() * 4);
            const noteEl = document.createElement('div');
            noteEl.classList.add('note');
            noteEl.style.top = '-20px';
            tracks[trackIndex].appendChild(noteEl);

            notes.push({
                element: noteEl,
                track: trackIndex,
                y: -20
            });
        }

        function gameLoop() {
            for (let i = notes.length - 1; i >= 0; i--) {
                let note = notes[i];
                note.y += noteSpeed;
                note.element.style.top = note.y + 'px';

                if (note.y > gameHeight) {
                    showJudgment('MISS', '#ff0055');
                    updateScore(-50); 
                    note.element.remove();
                    notes.splice(i, 1);
                }
            }
            animationId = requestAnimationFrame(gameLoop);
        }

        function pauseGameLoop() {
            clearInterval(gameInterval);
            gameInterval = null;
            cancelAnimationFrame(animationId);
            animationId = null;
        }

        function endGame(isFinished) {
            pauseGameLoop();

            if (player && typeof player.destroy === 'function') {
                player.destroy();
            }

            notes.forEach(note => note.element.remove());
            notes = [];

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('rhythm_high_score', highScore);
                highScoreElement.innerText = highScore;
                alert(`🎉 NEW HIGH SCORE: ${score}점`);
            } else if (isFinished) {
                alert(`PLAY FINISHED!\n최종 점수: ${score}점`);
            }

            gameHeader.style.display = 'none';
            gameContainer.style.display = 'none';
            setupUI.style.display = 'block';
        }

        window.addEventListener('keydown', (e) => {
            if (e.isComposing) return;
            if (gameContainer.style.display !== 'flex') return; 

            const key = e.key.toLowerCase();
            if (keys[key] !== undefined) {
                const trackIndex = keys[key];
                
                tracks[trackIndex].classList.add('key-active');
                setTimeout(() => tracks[trackIndex].classList.remove('key-active'), 80);

                const trackNotes = notes.filter(n => n.track === trackIndex);
                
                if (trackNotes.length > 0) {
                    const targetNote = trackNotes[0];
                    const hitLineY = gameHeight - hitZone - 4; 
                    const noteCenterY = targetNote.y + 9;     
                    const distance = Math.abs(noteCenterY - hitLineY); 

                    if (distance < hitTolerance) {
                        showJudgment('PERFECT', '#00f0ff');
                        updateScore(100);
                        
                        targetNote.element.remove();
                        const indexToRemove = notes.indexOf(targetNote);
                        if (indexToRemove > -1) {
                            notes.splice(indexToRemove, 1);
                        }
                    } else {
                        showJudgment('WRONG', '#ffbb00');
                        updateScore(-30); 
                    }
                } else {
                    showJudgment('WRONG', '#ffbb00');
                    updateScore(-30);
                }
            }
        });
    </script>
</body>
</html>
