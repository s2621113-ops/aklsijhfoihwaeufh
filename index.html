<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>네온 아케이드 유튜브 리듬 게임 Pro</title>
    <style>
        :root {
            --neon-cyan: #00f0ff;
            --neon-magenta: #ff007f;
            --neon-purple: #9d4edd;
            --neon-gold: #ffd700;
            --bg-dark: #05050b;
            --lane-width: 650px;
            --lane-height: 800px;
        }

        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        #youtube-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            opacity: 0.2;
            pointer-events: none;
        }
        #youtube-bg iframe, #player {
            width: 100% !important;
            height: 100% !important;
        }

        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, transparent 30%, rgba(5, 5, 11, 0.85) 85%);
            z-index: -1;
            pointer-events: none;
        }

        #setup-ui {
            background: linear-gradient(145deg, #101020, #171730);
            border: 2px solid var(--neon-purple);
            box-shadow: 0 0 30px rgba(157, 78, 221, 0.5);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            z-index: 100;
            width: 420px;
        }
        #setup-ui h2 {
            margin-top: 0;
            color: var(--neon-cyan);
            text-shadow: 0 0 12px var(--neon-cyan);
            font-size: 32px;
            letter-spacing: 4px;
        }
        #setup-ui input {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            margin-bottom: 25px;
            border: 1px solid #444;
            background-color: #070710;
            color: white;
            border-radius: 8px;
            font-size: 15px;
        }
        .difficulty-container {
            margin-bottom: 30px;
        }
        .difficulty-container p {
            margin-bottom: 12px;
            font-size: 14px;
            color: #888;
            letter-spacing: 2px;
        }
        .diff-btn {
            padding: 10px 16px;
            margin: 0 4px;
            background-color: #1a1a26;
            color: #777;
            border: 1px solid #333;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            font-size: 13px;
        }
        .diff-btn.active {
            border-color: var(--neon-magenta);
            background-color: rgba(255, 0, 127, 0.15);
            color: var(--neon-magenta);
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
        }
        .diff-btn.active.v-hard {
            border-color: var(--neon-gold);
            background-color: rgba(255, 215, 0, 0.15);
            color: var(--neon-gold);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }
        #start-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(90deg, var(--neon-magenta), var(--neon-purple));
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(255, 0, 127, 0.4);
            transition: 0.2s;
        }
        #start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(255, 0, 127, 0.7);
        }

        #game-layout {
            display: none;
            flex-direction: row;
            align-items: flex-end;
            gap: 30px;
            z-index: 5;
        }

        #stage-3d {
            perspective: 500px;
        }

        #game-container {
            position: relative;
            width: var(--lane-width);
            height: var(--lane-height);
            background: linear-gradient(to bottom, rgba(10, 10, 25, 0.95), rgba(5, 5, 15, 0.75));
            border-left: 4px solid #3a3a6a;
            border-right: 4px solid #3a3a6a;
            box-shadow: 0 0 60px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: row;
            transform: rotateX(14deg);
            transform-origin: bottom center;
        }

        #side-dashboard {
            width: 220px;
            background: linear-gradient(135deg, rgba(20, 20, 40, 0.9), rgba(10, 10, 25, 0.9));
            border: 2px solid #3a3a6a;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 0 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 20px;
        }
        .dash-block h3 {
            margin: 0 0 5px 0;
            font-size: 13px;
            color: #8a8eb5;
            letter-spacing: 1px;
        }
        .dash-value {
            font-size: 28px;
            font-weight: 900;
            color: var(--neon-cyan);
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
            font-family: monospace;
        }
        #exit-btn {
            width: 100%;
            padding: 12px;
            background-color: rgba(255,255,255,0.03);
            color: #aaa;
            border: 1px solid #444;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: 0.2s;
            margin-top: 10px;
        }
        #exit-btn:hover {
            background-color: var(--neon-magenta);
            border-color: var(--neon-magenta);
            color: white;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.6);
        }

        .track {
            flex: 1;
            border-right: 2px solid rgba(255, 255, 255, 0.04);
            position: relative;
        }
        .track:last-child {
            border-right: none;
        }

        .note {
            position: absolute;
            width: 96%;
            left: 2%;
            height: 26px;
            background: linear-gradient(90deg, #3bf5ff, #0077ff);
            border-radius: 4px;
            box-shadow: 0 0 16px #00f0ff, inset 0 3px 3px rgba(255,255,255,0.8);
        }

        #hit-line {
            position: absolute;
            bottom: 110px;
            width: 100%;
            height: 12px;
            background: linear-gradient(90deg, transparent, var(--neon-magenta), transparent);
            box-shadow: 0 0 25px var(--neon-magenta), 0 0 8px #fff;
            z-index: 10;
        }
        
        .key-label {
            position: absolute;
            bottom: 35px;
            width: 100%;
            text-align: center;
            font-weight: 900;
            font-size: 28px;
            color: #4a4e6d;
            font-family: monospace;
        }
        
        .key-active {
            background: linear-gradient(to top, rgba(0, 240, 255, 0.25) 0%, rgba(0, 240, 255, 0.03) 60%, transparent 100%);
        }
        .key-active .key-label {
            color: var(--neon-cyan);
            text-shadow: 0 0 12px var(--neon-cyan);
        }

        #judgment-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            z-index: 20;
        }
        #judgment-display {
            font-size: 46px;
            font-weight: 900;
            font-style: italic;
            letter-spacing: 4px;
            opacity: 0;
            text-transform: uppercase;
        }
        
        #combo-display {
            font-size: 38px;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.6);
            font-family: monospace;
            margin-top: 5px;
            opacity: 0;
        }
        #combo-display span {
            font-size: 16px;
            font-weight: 400;
            color: #8a8eb5;
            margin-left: 4px;
        }

        .animate-judg {
            animation: popText 0.22s ease-out forwards;
        }
        .show-combo {
            opacity: 1 !important;
            transform: scale(1.1);
            transition: transform 0.05s ease-out;
        }

        @keyframes popText {
            0% { transform: scale(0.5); opacity: 0; }
            30% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(1.0); opacity: 0; }
        }

        #speed-alert {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            font-weight: 900;
            color: var(--neon-gold);
            text-shadow: 0 0 15px var(--neon-gold);
            letter-spacing: 5px;
            opacity: 0;
            pointer-events: none;
            z-index: 30;
        }
        .animate-speed {
            animation: speedFlash 0.6s ease-in-out 2;
        }
        @keyframes speedFlash {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
        }

        #high-score-text {
            font-size: 14px;
            color: #5a5e7d;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div id="youtube-bg"><div id="player"></div></div>
    <div class="bg-overlay"></div>

    <div id="setup-ui">
        <h2>NEON RHYTHM</h2>
        <input type="text" id="youtube-url" placeholder="YOUTUBE LINK HERE" value="https://www.youtube.com/watch?v=dQw4w9WgXcQ">
        
        <div class="difficulty-container">
            <p>SELECT DIFFICULTY</p>
            <button class="diff-btn" onclick="selectDifficulty('easy', event)">EASY</button>
            <button class="diff-btn active" onclick="selectDifficulty('normal', event)">NORMAL</button>
            <button class="diff-btn" onclick="selectDifficulty('hard', event)">HARD</button>
            <button class="diff-btn" onclick="selectDifficulty('vhard', event)" style="color: #bb9e00;">V-HARD</button>
        </div>

        <button id="start-btn" onclick="startGame()">GAME START</button>
        <div id="high-score-text">HIGH SCORE: <span id="high-score">000000</span></div>
    </div>

    <div id="game-layout">
        <div id="stage-3d">
            <div id="game-container">
                <div id="speed-alert">SPEED UP!</div>
                <div id="judgment-container">
                    <div id="judgment-display">PERFECT</div>
                    <div id="combo-display">0<span>COMBO</span></div>
                </div>
                <div id="hit-line"></div>
                <div class="track" id="track-0"><div class="key-label">D</div></div>
                <div class="track" id="track-1"><div class="key-label">F</div></div>
                <div class="track" id="track-2"><div class="key-label">J</div></div>
                <div class="track" id="track-3"><div class="key-label">K</div></div>
            </div>
        </div>

        <div id="side-dashboard">
            <div class="dash-block">
                <h3>CURRENT SCORE</h3>
                <div id="score-display" class="dash-value">000000</div>
            </div>
            <div class="dash-block">
                <h3>TARGET HIGH</h3>
                <div id="dash-high-display" class="dash-value" style="color: var(--neon-purple);">000000</div>
            </div>
            <div class="dash-block">
                <h3>SPEED</h3>
                <div id="speed-display" class="dash-value" style="color: var(--neon-gold);">1.0x</div>
            </div>
            <button id="exit-btn" onclick="endGame(false)">QUIT GAME</button>
        </div>
    </div>

    <script>
        // 안전장치 강화: 유튜브 스크립트 강제 바인딩
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        const scoreElement = document.getElementById('score-display');
        const dashHighElement = document.getElementById('dash-high-display');
        const highScoreElement = document.getElementById('high-score');
        const speedElement = document.getElementById('speed-display');
        
        const setupUI = document.getElementById('setup-ui');
        const gameLayout = document.getElementById('game-layout');
        const gameContainer = document.getElementById('game-container');
        const judgmentDisplay = document.getElementById('judgment-display');
        const comboDisplay = document.getElementById('combo-display');
        const speedAlert = document.getElementById('speed-alert');
        
        const tracks = [
            document.getElementById('track-0'),
            document.getElementById('track-1'),
            document.getElementById('track-2'),
            document.getElementById('track-3')
        ];
        
        const keys = { 'd': 0, 'f': 1, 'j': 2, 'k': 3 };
        
        let notes = []; 
        let score = 0;
        let combo = 0;
        let baseSpeed = 8;
        let noteSpeed = 8; 
        let spawnRate = 450; 
        let highScore = localStorage.getItem('rhythm_high_score') || 0;
        let gameInterval;
        let animationId;
        let player;
        let speedTier = 0;

        highScoreElement.innerText = String(highScore).padStart(6, '0');
        dashHighElement.innerText = String(highScore).padStart(6, '0');

        function onYouTubeIframeAPIReady() { console.log("API Ready"); }

        function selectDifficulty(diff, e) {
            const buttons = document.querySelectorAll('.diff-btn');
            buttons.forEach(btn => btn.classList.remove('active', 'v-hard'));
            
            if (diff === 'easy') {
                e.target.classList.add('active');
                baseSpeed = 6; spawnRate = 650;
            } else if (diff === 'normal') {
                e.target.classList.add('active');
                baseSpeed = 8; spawnRate = 450;
            } else if (diff === 'hard') {
                e.target.classList.add('active');
                baseSpeed = 11; spawnRate = 280;
            } else if (diff === 'vhard') {
                e.target.classList.add('active', 'v-hard');
                baseSpeed = 15; spawnRate = 180;
            }
            noteSpeed = baseSpeed;
        }

        function extractVideoID(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function showJudgment(text, color) {
            judgmentDisplay.innerText = text;
            judgmentDisplay.style.color = color;
            judgmentDisplay.style.textShadow = `0 0 15px ${color}`;
            judgmentDisplay.classList.remove('animate-judg');
            void judgmentDisplay.offsetWidth; 
            judgmentDisplay.classList.add('animate-judg');
        }

        function triggerCombo() {
            if (combo > 0) {
                comboDisplay.innerHTML = `${combo}<span>COMBO</span>`;
                comboDisplay.classList.remove('show-combo');
                void comboDisplay.offsetWidth;
                comboDisplay.classList.add('show-combo');
            } else {
                comboDisplay.classList.remove('show-combo');
            }
            checkSpeedUp();
        }

        function checkSpeedUp() {
            let targetSpeed = baseSpeed;
            let currentTier = 0;

            if (combo >= 150) { currentTier = 3; targetSpeed += 4.5; }
            else if (combo >= 70) { currentTier = 2; targetSpeed += 3.0; }
            else if (combo >= 30) { currentTier = 1; targetSpeed += 1.5; }

            if (currentTier > speedTier) {
                speedAlert.classList.remove('animate-speed');
                void speedAlert.offsetWidth;
                speedAlert.classList.add('animate-speed');
            }
            
            speedTier = currentTier;
            noteSpeed = targetSpeed;
            speedElement.innerText = (noteSpeed / baseSpeed).toFixed(1) + "x";
        }

        function updateScore(amount) {
            score += amount;
            if (score < 0) score = 0;
            scoreElement.innerText = String(score).padStart(6, '0');
        }

        function startGame() {
            const urlInput = document.getElementById('youtube-url').value;
            const videoId = extractVideoID(urlInput);

            if (!videoId) {
                alert("올바른 유튜브 링크를 입력해주세요!");
                return;
            }

            score = 0;
            combo = 0;
            speedTier = 0;
            noteSpeed = baseSpeed;
            updateScore(0);
            triggerCombo();
            notes = [];
            
            speedElement.innerText = "1.0x";
            dashHighElement.innerText = String(highScore).padStart(6, '0');

            setupUI.style.display = 'none';
            gameLayout.style.display = 'flex';

            initPlayer(videoId);
        }

        function initPlayer(videoId) {
            document.getElementById('youtube-bg').innerHTML = '<div id="player"></div>';

            // [핵심 변경] 상용 차단 시에도 100% 가동 보장 루틴
            if (typeof YT === 'undefined' || !YT.Player) {
                console.log("유튜브 API가 차단되어 대체 모드로 진입합니다.");
                startFallbackGame();
                return;
            }

            try {
                player = new YT.Player('player', {
                    videoId: videoId,
                    playerVars: { 
                        'autoplay': 1, 
                        'controls': 0, 
                        'disablekb': 1, 
                        'rel': 0, 
                        'modestbranding': 1,
                        'origin': window.location.origin // 실시간 도메인 매핑 보안 연동
                    },
                    events: {
                        'onReady': (e) => {
                            try { e.target.playVideo(); } catch(err) { startFallbackGame(); }
                        },
                        'onStateChange': onPlayerStateChange,
                        'onError': () => { startFallbackGame(); } // 에러 발생 시 즉시 백업 모드 가동
                    }
                });
            } catch (e) {
                startFallbackGame();
            }
        }

        function startFallbackGame() {
            if (!gameInterval) gameInterval = setInterval(spawnNote, spawnRate);
            if (!animationId) gameLoop();
        }

        function onPlayerStateChange(event) {
            if (event.data == YT.PlayerState.PLAYING || event.data == 3) {
                if (!gameInterval) gameInterval = setInterval(spawnNote, spawnRate);
                if (!animationId) gameLoop();
            } else if (event.data == YT.PlayerState.PAUSED) {
                pauseGameLoop();
            } else if (event.data == YT.PlayerState.ENDED) {
                endGame(true); 
            }
        }

        function spawnNote() {
            const trackIndex = Math.floor(Math.random() * 4);
            const noteEl = document.createElement('div');
            noteEl.classList.add('note');
            noteEl.style.top = '-26px';
            tracks[trackIndex].appendChild(noteEl);

            notes.push({ element: noteEl, track: trackIndex, y: -26 });
        }

        function gameLoop() {
            for (let i = notes.length - 1; i >= 0; i--) {
                let note = notes[i];
                note.y += noteSpeed;
                note.element.style.top = note.y + 'px';

                if (note.y > 800) {
                    showJudgment('MISS', '#ff0055');
                    combo = 0; 
                    triggerCombo();
                    updateScore(-50); 
                    note.element.remove();
                    notes.splice(i, 1);
                }
            }
            animationId = requestAnimationFrame(gameLoop);
        }

        function pauseGameLoop() {
            clearInterval(gameInterval); gameInterval = null;
            cancelAnimationFrame(animationId); animationId = null;
        }

        function endGame(isFinished) {
            pauseGameLoop();
            if (player && typeof player.destroy === 'function') player.destroy();

            notes.forEach(note => note.element.remove());
            notes = [];

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('rhythm_high_score', highScore);
                highScoreElement.innerText = String(highScore).padStart(6, '0');
                alert(`🎉 NEW HIGH SCORE: ${score}점`);
            } else if (isFinished) {
                alert(`PLAY FINISHED!\n최종 점수: ${score}점`);
            }

            gameLayout.style.display = 'none';
            setupUI.style.display = 'block';
        }

        window.addEventListener('keydown', (e) => {
            if (e.isComposing) return;
            if (gameLayout.style.display !== 'flex') return; 

            const key = e.key.toLowerCase();
            if (keys[key] !== undefined) {
                const trackIndex = keys[key];
                
                tracks[trackIndex].classList.add('key-active');
                setTimeout(() => tracks[trackIndex].classList.remove('key-active'), 80);

                const trackNotes = notes.filter(n => n.track === trackIndex);
                
                if (trackNotes.length > 0) {
                    const targetNote = trackNotes[0];
                    const hitLineY = 800 - 110 - 6; 
                    const noteCenterY = targetNote.y + 13;     
                    const distance = Math.abs(noteCenterY - hitLineY); 

                    if (distance < 70) {
                        showJudgment('PERFECT', '#00f0ff');
                        combo++;
                        triggerCombo();
                        updateScore(100);
                        
                        targetNote.element.remove();
                        const indexToRemove = notes.indexOf(targetNote);
                        if (indexToRemove > -1) notes.splice(indexToRemove, 1);
                    } else {
                        showJudgment('WRONG', '#ffbb00');
                        combo = 0; 
                        triggerCombo();
                        updateScore(-30); 
                    }
                } else {
                    showJudgment('WRONG', '#ffbb00');
                    combo = 0;
                    triggerCombo();
                    updateScore(-30);
                }
            }
        });
    </script>
</body>
</html>
