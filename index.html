<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>네온 아케이드 유튜브 리듬 게임</title>
    <style>
        :root {
            --neon-cyan: #00f0ff;
            --neon-magenta: #ff007f;
            --neon-purple: #9d4edd;
            --bg-dark: #05050b;
            --lane-width: 650px;
            --lane-height: 800px;
        }

        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        /* 전체 스크린 배경으로 유튜브 확장 */
        #youtube-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            opacity: 0.25;
            pointer-events: none;
        }
        #youtube-bg iframe, #player {
            width: 100% !important;
            height: 100% !important;
        }

        /* 암전 배경 필터 효과 (집중도 향상) */
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, transparent 40%, rgba(5, 5, 11, 0.8) 90%);
            z-index: -1;
            pointer-events: none;
        }

        /* 메인 설정 UI (오프닝 스크린) */
        #setup-ui {
            background: linear-gradient(145deg, #101020, #171730);
            border: 2px solid var(--neon-purple);
            box-shadow: 0 0 30px rgba(157, 78, 221, 0.5);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            z-index: 100;
            width: 400px;
        }
        #setup-ui h2 {
            margin-top: 0;
            color: var(--neon-cyan);
            text-shadow: 0 0 12px var(--neon-cyan);
            font-size: 32px;
            letter-spacing: 4px;
        }
        #setup-ui input {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            margin-bottom: 25px;
            border: 1px solid #444;
            background-color: #070710;
            color: white;
            border-radius: 8px;
            font-size: 15px;
            transition: 0.3s;
        }
        #setup-ui input:focus {
            border-color: var(--neon-cyan);
            outline: none;
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.6);
        }
        .difficulty-container {
            margin-bottom: 30px;
        }
        .difficulty-container p {
            margin-bottom: 12px;
            font-size: 14px;
            color: #888;
            letter-spacing: 2px;
        }
        .diff-btn {
            padding: 10px 24px;
            margin: 0 8px;
            background-color: #1a1a26;
            color: #777;
            border: 1px solid #333;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .diff-btn.active {
            border-color: var(--neon-magenta);
            background-color: rgba(255, 0, 127, 0.15);
            color: var(--neon-magenta);
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
        }
        #start-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(90deg, var(--neon-magenta), var(--neon-purple));
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(255, 0, 127, 0.4);
            transition: 0.2s;
            letter-spacing: 1px;
        }
        #start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(255, 0, 127, 0.7);
        }

        /* 게임 상단 정보 계기판 */
        #game-header {
            width: var(--lane-width);
            display: none;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            z-index: 10;
        }
        #score-display {
            font-size: 32px;
            font-weight: 900;
            color: var(--neon-cyan);
            text-shadow: 0 0 12px rgba(0, 240, 255, 0.6);
            font-family: monospace;
        }
        #exit-btn {
            padding: 10px 20px;
            background-color: rgba(255,255,255,0.03);
            color: #aaa;
            border: 1px solid #333;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: 0.2s;
        }
        #exit-btn:hover {
            background-color: var(--neon-magenta);
            border-color: var(--neon-magenta);
            color: white;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.6);
        }

        /* 3D 공간감을 위한 기어 컨테이너 피치 조정 */
        #stage-3d {
            perspective: 400px; /* 원근감 강도 조절 */
            display: none;
            z-index: 5;
        }

        /* 초대형 게임 기어 스크린 */
        #game-container {
            position: relative;
            width: var(--lane-width);
            height: var(--lane-height);
            background: linear-gradient(to bottom, rgba(10, 10, 25, 0.95), rgba(5, 5, 15, 0.75));
            border-left: 4px solid #2a2a4a;
            border-right: 4px solid #2a2a4a;
            box-shadow: 0 0 50px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: row;
            transform: rotateX(12deg); /* 탑다운 원근 경사각 */
            transform-origin: bottom center;
        }

        /* 트랙 라인 스타일 */
        .track {
            flex: 1;
            border-right: 2px solid rgba(255, 255, 255, 0.05);
            position: relative;
        }
        .track:last-child {
            border-right: none;
        }

        /* 아케이드 스타일 슬림 와이드 노트 */
        .note {
            position: absolute;
            width: 96%;
            left: 2%;
            height: 24px;
            background: linear-gradient(90deg, #3bf5ff, #0077ff);
            border-radius: 4px;
            box-shadow: 0 0 16px #00f0ff, inset 0 3px 3px rgba(255,255,255,0.8);
        }

        /* 판정선 및 위치 고정 */
        #hit-line {
            position: absolute;
            bottom: 100px;
            width: 100%;
            height: 8px;
            background: linear-gradient(90deg, transparent, var(--neon-magenta), transparent);
            box-shadow: 0 0 20px var(--neon-magenta), 0 0 5px #fff;
            z-index: 10;
        }
        
        /* 트랙 하단 건반 레이블 */
        .key-label {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            font-weight: 900;
            font-size: 26px;
            color: #4a4e6d;
            font-family: monospace;
        }
        
        /* 레이저 빔 이펙트 효과 */
        .key-active {
            background: linear-gradient(to top, rgba(0, 240, 255, 0.25) 0%, rgba(0, 240, 255, 0.05) 60%, transparent 100%);
        }
        .key-active .key-label {
            color: var(--neon-cyan);
            text-shadow: 0 0 12px var(--neon-cyan);
        }

        /* 중앙 콤보/판정 인디케이터 */
        #judgment-display {
            position: absolute;
            top: 52%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 42px;
            font-weight: 900;
            font-style: italic;
            pointer-events: none;
            z-index: 20;
            letter-spacing: 4px;
            opacity: 0;
            text-transform: uppercase;
        }
        .animate-judg {
            animation: popText 0.25s ease-out forwards;
        }

        @keyframes popText {
            0% { transform: translate(-50%, -30%) scale(0.5); opacity: 0; }
            30% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
            100% { transform: translate(-50%, -55%) scale(1.0); opacity: 0; }
        }

        #high-score-text {
            font-size: 14px;
            color: #5a5e7d;
            margin-top: 20px;
            letter-spacing: 1px;
        }
        #high-score {
            color: var(--neon-cyan);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="youtube-bg"><div id="player"></div></div>
    <div class="bg-overlay"></div>

    <div id="setup-ui">
        <h2>NEON RHYTHM</h2>
        <input type="text" id="youtube-url" placeholder="YOUTUBE LINK HERE" value="https://www.youtube.com/watch?v=dQw4w9WgXcQ">
        
        <div class="difficulty-container">
            <p>SELECT DIFFICULTY</p>
            <button class="diff-btn" onclick="selectDifficulty('easy', event)">EASY</button>
            <button class="diff-btn active" onclick="selectDifficulty('normal', event)">NORMAL</button>
            <button class="diff-btn" onclick="selectDifficulty('hard', event)">HARD</button>
        </div>

        <button id="start-btn" onclick="startGame()">GAME START</button>
        <div id="high-score-text">HIGH SCORE: <span id="high-score">0</span></div>
    </div>

    <div id="game-header">
        <div id="score-display">SCORE: <span id="score">000000</span></div>
        <button id="exit-btn" onclick="endGame(false)">QUIT</button>
    </div>

    <div id="stage-3d">
        <div id="game-container">
            <div id="judgment-display">PERFECT</div>
            <div id="hit-line"></div>
            <div class="track" id="track-0"><div class="key-label">D</div></div>
            <div class="track" id="track-1"><div class="key-label">F</div></div>
            <div class="track" id="track-2"><div class="key-label">J</div></div>
            <div class="track" id="track-3"><div class="key-label">K</div></div>
        </div>
    </div>

    <script>
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('high-score');
        const setupUI = document.getElementById('setup-ui');
        const gameHeader = document.getElementById('game-header');
        const stage3D = document.getElementById('stage-3d');
        const gameContainer = document.getElementById('game-container');
        const judgmentDisplay = document.getElementById('judgment-display');
        
        const tracks = [
            document.getElementById('track-0'),
            document.getElementById('track-1'),
            document.getElementById('track-2'),
            document.getElementById('track-3')
        ];
        
        const keys = { 'd': 0, 'f': 1, 'j': 2, 'k': 3 };
        
        let notes = []; 
        let score = 0;
        let highScore = localStorage.getItem('rhythm_high_score') || 0;
        let gameInterval;
        let animationId;
        
        let currentDifficulty = 'normal';
        let noteSpeed = 8; 
        let spawnRate = 450; 

        const gameHeight = 800; // 스케일업 완료
        const hitZone = 100;    // 판정선 위치 조정 완료
        const hitTolerance = 50; 
        let player;

        highScoreElement.innerText = highScore;

        function onYouTubeIframeAPIReady() {
            console.log("API Ready");
        }

        function selectDifficulty(diff, e) {
            currentDifficulty = diff;
            const buttons = document.querySelectorAll('.diff-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            e.target.classList.add('active');
            
            if (diff === 'easy') {
                noteSpeed = 6;
                spawnRate = 700;
            } else if (diff === 'normal') {
                noteSpeed = 8;
                spawnRate = 450;
            } else if (diff === 'hard') {
                noteSpeed = 12;
                spawnRate = 280;
            }
        }

        function extractVideoID(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function showJudgment(text, color) {
            judgmentDisplay.innerText = text;
            judgmentDisplay.style.color = color;
            judgmentDisplay.style.textShadow = `0 0 15px ${color}`;
            judgmentDisplay.classList.remove('animate-judg');
            void judgmentDisplay.offsetWidth; 
            judgmentDisplay.classList.add('animate-judg');
        }

        function updateScore(amount) {
            score += amount;
            scoreElement.innerText = String(score).padStart(6, '0');
        }

        function startGame() {
            const urlInput = document.getElementById('youtube-url').value;
            const videoId = extractVideoID(urlInput);

            if (!videoId) {
                alert("올바른 유튜브 링크를 입력해주세요!");
                return;
            }

            score = 0;
            updateScore(0);
            notes = [];

            setupUI.style.display = 'none';
            gameHeader.style.display = 'flex';
            stage3D.style.display = 'block';

            initPlayer(videoId);
        }

        function initPlayer(videoId) {
            document.getElementById('youtube-bg').innerHTML = '<div id="player"></div>';

            if (typeof YT === 'undefined' || !YT.Player) {
                startFallbackGame();
                return;
            }

            player = new YT.Player('player', {
                videoId: videoId,
                playerVars: {
                    'autoplay': 1,
                    'controls': 0,
                    'disablekb': 1,
                    'rel': 0,
                    'modestbranding': 1
                },
                events: {
                    'onReady': (e) => e.target.playVideo(),
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function startFallbackGame() {
            if (!gameInterval) gameInterval = setInterval(spawnNote, spawnRate);
            if (!animationId) gameLoop();
        }

        function onPlayerStateChange(event) {
            if (event.data == YT.PlayerState.PLAYING || event.data == 3) {
                if (!gameInterval) gameInterval = setInterval(spawnNote, spawnRate);
                if (!animationId) gameLoop();
            }
            else if (event.data == YT.PlayerState.PAUSED) {
                pauseGameLoop();
            }
            else if (event.data == YT.PlayerState.ENDED) {
                endGame(true); 
            }
        }

        function spawnNote() {
            const trackIndex = Math.floor(Math.random() * 4);
            const noteEl = document.createElement('div');
            noteEl.classList.add('note');
            noteEl.style.top = '-25px';
            tracks[trackIndex].appendChild(noteEl);

            notes.push({
                element: noteEl,
                track: trackIndex,
                y: -25
            });
        }

        function gameLoop() {
            for (let i = notes.length - 1; i >= 0; i--) {
                let note = notes[i];
                note.y += noteSpeed;
                note.element.style.top = note.y + 'px';

                if (note.y > gameHeight) {
                    showJudgment('MISS', '#ff0055');
                    updateScore(-50); 
                    note.element.remove();
                    notes.splice(i, 1);
                }
            }
            animationId = requestAnimationFrame(gameLoop);
        }

        function pauseGameLoop() {
            clearInterval(gameInterval);
            gameInterval = null;
            cancelAnimationFrame(animationId);
            animationId = null;
        }

        function endGame(isFinished) {
            pauseGameLoop();

            if (player && typeof player.destroy === 'function') {
                player.destroy();
            }

            notes.forEach(note => note.element.remove());
            notes = [];

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('rhythm_high_score', highScore);
                highScoreElement.innerText = highScore;
                alert(`🎉 NEW HIGH SCORE: ${score}점`);
            } else if (isFinished) {
                alert(`PLAY FINISHED!\n최종 점수: ${score}점`);
            }

            gameHeader.style.display = 'none';
            stage3D.style.display = 'none';
            setupUI.style.display = 'block';
        }

        window.addEventListener('keydown', (e) => {
            if (e.isComposing) return;
            if (stage3D.style.display !== 'block') return; 

            const key = e.key.toLowerCase();
            if (keys[key] !== undefined) {
                const trackIndex = keys[key];
                
                tracks[trackIndex].classList.add('key-active');
                setTimeout(() => tracks[trackIndex].classList.remove('key-active'), 80);

                const trackNotes = notes.filter(n => n.track === trackIndex);
                
                if (trackNotes.length > 0) {
                    const targetNote = trackNotes[0];
                    const hitLineY = gameHeight - hitZone - 4; 
                    const noteCenterY = targetNote.y + 12;     
                    const distance = Math.abs(noteCenterY - hitLineY); 

                    if (distance < hitTolerance) {
                        showJudgment('PERFECT', '#00f0ff');
                        updateScore(100);
                        
                        targetNote.element.remove();
                        const indexToRemove = notes.indexOf(targetNote);
                        if (indexToRemove > -1) {
                            notes.splice(indexToRemove, 1);
                        }
                    } else {
                        showJudgment('WRONG', '#ffbb00');
                        updateScore(-30); 
                    }
                } else {
                    showJudgment('WRONG', '#ffbb00');
                    updateScore(-30);
                }
            }
        });
    </script>
</body>
</html>
